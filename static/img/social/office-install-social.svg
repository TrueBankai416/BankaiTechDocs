<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1a1f2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0078d4;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#0078d4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0078d4;stop-opacity:0"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#d83b01" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid -->
  <g opacity="0.04">
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#0078d4" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#0078d4" stroke-width="1"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#0078d4" stroke-width="1"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#0078d4" stroke-width="1"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#0078d4" stroke-width="1"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#0078d4" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#0078d4" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#0078d4" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#0078d4" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#0078d4" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#0078d4" stroke-width="1"/>
  </g>

  <rect x="0" y="0" width="6" height="630" fill="#0078d4" opacity="0.9"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentGrad)"/>
  <rect x="0" y="627" width="1200" height="3" fill="url(#accentGrad)"/>

  <!-- Download / install visual — left -->
  <g transform="translate(90, 120)">
    <!-- Package box -->
    <rect x="60" y="140" width="280" height="190" rx="12" fill="#1e2840" stroke="#d83b01" stroke-width="2" opacity="0.9"/>
    <!-- Office "O" logo on box -->
    <text x="200" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="120" font-weight="800" fill="#d83b01" text-anchor="middle" opacity="0.85">O</text>
    <text x="200" y="316" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#8ab4d4" text-anchor="middle">Microsoft Office LTSC 2024</text>

    <!-- Download arrow -->
    <g filter="url(#softGlow)">
      <line x1="200" y1="0" x2="200" y2="110" stroke="#0078d4" stroke-width="6" stroke-linecap="round"/>
      <polygon points="170,88 200,125 230,88" fill="#0078d4"/>
    </g>

    <!-- Download source label -->
    <text x="200" y="24" font-family="'Consolas', monospace" font-size="14" fill="#8ab4d4" text-anchor="middle">setup.exe /download</text>
    <text x="200" y="46" font-family="'Consolas', monospace" font-size="14" fill="#8ab4d4" text-anchor="middle">configuration.xml</text>
  </g>

  <!-- ODT config block -->
  <g transform="translate(540, 100)">
    <rect x="0" y="0" width="580" height="280" rx="12" fill="#1e2840" stroke="#0078d4" stroke-width="1.5" opacity="0.9"/>
    <!-- Header -->
    <rect x="0" y="0" width="580" height="40" rx="12" fill="#0f1929"/>
    <rect x="0" y="28" width="580" height="12" fill="#0f1929"/>
    <text x="290" y="26" font-family="'Consolas', monospace" font-size="14" fill="#d83b01" text-anchor="middle">configuration.xml</text>

    <!-- XML content -->
    <text x="20" y="65" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">&lt;<tspan fill="#7fba00">Configuration</tspan>&gt;</text>
    <text x="20" y="90" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">  &lt;<tspan fill="#7fba00">Add</tspan> <tspan fill="#ffb900">OfficeClientEdition</tspan>=<tspan fill="#28c840">"64"</tspan>&gt;</text>
    <text x="20" y="115" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">    &lt;<tspan fill="#7fba00">Product</tspan> <tspan fill="#ffb900">ID</tspan>=<tspan fill="#28c840">"ProPlus2024Volume"</tspan>&gt;</text>
    <text x="20" y="140" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">      &lt;<tspan fill="#7fba00">Language</tspan> <tspan fill="#ffb900">ID</tspan>=<tspan fill="#28c840">"en-us"</tspan> /&gt;</text>
    <text x="20" y="165" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">    &lt;/<tspan fill="#7fba00">Product</tspan>&gt;</text>
    <text x="20" y="190" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">  &lt;/<tspan fill="#7fba00">Add</tspan>&gt;</text>
    <text x="20" y="215" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">  &lt;<tspan fill="#7fba00">Display</tspan> <tspan fill="#ffb900">Level</tspan>=<tspan fill="#28c840">"Full"</tspan> /&gt;</text>
    <text x="20" y="240" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">  &lt;<tspan fill="#7fba00">AUTOACTIVATE</tspan> <tspan fill="#ffb900">Value</tspan>=<tspan fill="#28c840">"0"</tspan> /&gt;</text>
    <text x="20" y="265" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">&lt;/<tspan fill="#7fba00">Configuration</tspan>&gt;</text>
  </g>

  <!-- Main text -->
  <text x="740" y="430" font-family="'Segoe UI', Arial, sans-serif" font-size="60" font-weight="700"
        fill="white" text-anchor="middle" filter="url(#softGlow)">Install Office</text>
  <text x="740" y="480" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="400"
        fill="#8ab4d4" text-anchor="middle">LTSC Professional Plus 2024</text>

  <rect x="490" y="498" width="500" height="2" rx="1" fill="#0078d4" opacity="0.6"/>

  <!-- Tag pills -->
  <g transform="translate(490, 522)">
    <rect x="0" y="0" width="180" height="38" rx="19" fill="#d83b01" opacity="0.2"/>
    <rect x="0" y="0" width="180" height="38" rx="19" fill="none" stroke="#d83b01" stroke-width="1.5" opacity="0.6"/>
    <text x="90" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#ff7043" text-anchor="middle">Microsoft Office</text>
    <rect x="195" y="0" width="140" height="38" rx="19" fill="#0078d4" opacity="0.25"/>
    <rect x="195" y="0" width="140" height="38" rx="19" fill="none" stroke="#0078d4" stroke-width="1.5" opacity="0.6"/>
    <text x="265" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#8ab4d4" text-anchor="middle">Installation</text>
    <rect x="350" y="0" width="100" height="38" rx="19" fill="#0078d4" opacity="0.25"/>
    <rect x="350" y="0" width="100" height="38" rx="19" fill="none" stroke="#0078d4" stroke-width="1.5" opacity="0.6"/>
    <text x="400" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#8ab4d4" text-anchor="middle">ODT</text>
  </g>

  <text x="1160" y="600" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600"
        fill="#0078d4" text-anchor="end" opacity="0.8">BankaiTech Docs</text>
</svg>
