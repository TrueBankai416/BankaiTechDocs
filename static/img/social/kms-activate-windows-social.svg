<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1a1f2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0078d4;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#0078d4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0078d4;stop-opacity:0"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0078d4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid -->
  <g opacity="0.04">
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#0078d4" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#0078d4" stroke-width="1"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#0078d4" stroke-width="1"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#0078d4" stroke-width="1"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#0078d4" stroke-width="1"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#0078d4" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#0078d4" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#0078d4" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#0078d4" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#0078d4" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#0078d4" stroke-width="1"/>
  </g>

  <rect x="0" y="0" width="6" height="630" fill="#0078d4" opacity="0.9"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentGrad)"/>
  <rect x="0" y="627" width="1200" height="3" fill="url(#accentGrad)"/>

  <!-- Windows logo node — left -->
  <g transform="translate(80, 165)">
    <rect x="0" y="0" width="180" height="180" rx="18" fill="#1e2840" stroke="#0078d4" stroke-width="2" opacity="0.9"/>
    <!-- Mini Windows quadrant -->
    <rect x="22" y="22" width="60" height="60" rx="4" fill="#f25022" opacity="0.85"/>
    <rect x="88" y="22" width="60" height="60" rx="4" fill="#7fba00" opacity="0.85"/>
    <rect x="22" y="88" width="60" height="60" rx="4" fill="#00a4ef" opacity="0.85"/>
    <rect x="88" y="88" width="60" height="60" rx="4" fill="#ffb900" opacity="0.85"/>
    <text x="90" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#8ab4d4" text-anchor="middle" font-weight="600">Windows</text>
  </g>

  <!-- Connection arrow -->
  <g opacity="0.8">
    <line x1="260" y1="255" x2="390" y2="255" stroke="#0078d4" stroke-width="3" stroke-dasharray="10 6"/>
    <polygon points="384,247 394,255 384,263" fill="#0078d4"/>
    <!-- Label above -->
    <text x="325" y="238" font-family="'Consolas', monospace" font-size="14" fill="#8ab4d4" text-anchor="middle">slmgr /skms</text>
  </g>

  <!-- KMS Server node — center -->
  <g transform="translate(390, 155)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="240" height="200" rx="14" fill="#1e2840" stroke="#0078d4" stroke-width="2.5" opacity="0.95"/>
    <rect x="16" y="20" width="208" height="36" rx="6" fill="#0f1929" stroke="#0078d4" stroke-width="1" opacity="0.9"/>
    <circle cx="36" cy="38" r="7" fill="#28c840" opacity="0.9"/>
    <text x="56" y="44" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">KMS Server</text>
    <rect x="16" y="66" width="208" height="36" rx="6" fill="#0f1929" stroke="#0078d4" stroke-width="1" opacity="0.85"/>
    <circle cx="36" cy="84" r="7" fill="#28c840" opacity="0.9"/>
    <text x="56" y="90" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">:1688  Listening</text>
    <rect x="16" y="112" width="208" height="36" rx="6" fill="#0f1929" stroke="#0078d4" stroke-width="1" opacity="0.85"/>
    <circle cx="36" cy="130" r="7" fill="#28c840" opacity="0.9"/>
    <text x="56" y="136" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">Activated ✓</text>
    <text x="120" y="184" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0078d4" text-anchor="middle">KEY MGMT SERVICE</text>
  </g>

  <!-- Return arrow -->
  <g opacity="0.8">
    <line x1="630" y1="268" x2="760" y2="268" stroke="#28c840" stroke-width="3" stroke-dasharray="10 6"/>
    <polygon points="754,260 764,268 754,276" fill="#28c840"/>
    <text x="695" y="252" font-family="'Consolas', monospace" font-size="14" fill="#28c840" text-anchor="middle">Activated</text>
  </g>

  <!-- Activated checkmark node — right -->
  <g transform="translate(770, 165)">
    <rect x="0" y="0" width="180" height="180" rx="18" fill="#1e2840" stroke="#28c840" stroke-width="2" opacity="0.9"/>
    <!-- Big checkmark -->
    <polyline points="40,95 80,135 140,60" fill="none" stroke="#28c840" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
    <text x="90" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#28c840" text-anchor="middle" font-weight="600">Licensed</text>
  </g>

  <!-- Main text -->
  <text x="600" y="435" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="700"
        fill="white" text-anchor="middle" filter="url(#softGlow)">Activate Windows</text>
  <text x="600" y="484" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="400"
        fill="#8ab4d4" text-anchor="middle">Using a Local KMS Server</text>

  <rect x="300" y="502" width="600" height="2" rx="1" fill="#0078d4" opacity="0.6"/>

  <!-- Tag pills -->
  <g transform="translate(350, 528)">
    <rect x="0" y="0" width="120" height="38" rx="19" fill="#0078d4" opacity="0.25"/>
    <rect x="0" y="0" width="120" height="38" rx="19" fill="none" stroke="#0078d4" stroke-width="1.5" opacity="0.6"/>
    <text x="60" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#8ab4d4" text-anchor="middle">Windows</text>
    <rect x="135" y="0" width="100" height="38" rx="19" fill="#0078d4" opacity="0.25"/>
    <rect x="135" y="0" width="100" height="38" rx="19" fill="none" stroke="#0078d4" stroke-width="1.5" opacity="0.6"/>
    <text x="185" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#8ab4d4" text-anchor="middle">KMS</text>
    <rect x="250" y="0" width="150" height="38" rx="19" fill="#0078d4" opacity="0.25"/>
    <rect x="250" y="0" width="150" height="38" rx="19" fill="none" stroke="#0078d4" stroke-width="1.5" opacity="0.6"/>
    <text x="325" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#8ab4d4" text-anchor="middle">Activation</text>
  </g>

  <text x="1160" y="600" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600"
        fill="#0078d4" text-anchor="end" opacity="0.8">BankaiTech Docs</text>
</svg>
