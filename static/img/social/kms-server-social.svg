<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1a1f2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0078d4;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#0078d4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0078d4;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="dockerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2496ed"/>
      <stop offset="100%" style="stop-color:#1677b5"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2496ed" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid -->
  <g opacity="0.04">
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#0078d4" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#0078d4" stroke-width="1"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#0078d4" stroke-width="1"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#0078d4" stroke-width="1"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#0078d4" stroke-width="1"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#0078d4" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#0078d4" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#0078d4" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#0078d4" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#0078d4" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#0078d4" stroke-width="1"/>
  </g>

  <rect x="0" y="0" width="6" height="630" fill="#0078d4" opacity="0.9"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentGrad)"/>
  <rect x="0" y="627" width="1200" height="3" fill="url(#accentGrad)"/>

  <!-- Docker container visual — center left -->
  <g transform="translate(80, 100)" filter="url(#dropShadow)">
    <!-- Outer container border -->
    <rect x="0" y="0" width="420" height="330" rx="14" fill="#1a2535" stroke="#2496ed" stroke-width="2.5" opacity="0.95"/>

    <!-- docker-compose.yaml header -->
    <rect x="0" y="0" width="420" height="44" rx="14" fill="#0f1929"/>
    <rect x="0" y="30" width="420" height="14" fill="#0f1929"/>
    <text x="210" y="28" font-family="'Consolas', monospace" font-size="14" fill="#2496ed" text-anchor="middle">docker-compose.yaml</text>

    <!-- YAML content -->
    <text x="20" y="72" font-family="'Consolas', monospace" font-size="13" fill="#7fba00">services:</text>
    <text x="20" y="95" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">  py-kms:</text>
    <text x="20" y="118" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">    image: <tspan fill="#ffb900">py-kms/py-kms</tspan></text>
    <text x="20" y="141" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">    container_name: <tspan fill="#ffb900">py-kms</tspan></text>
    <text x="20" y="164" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">    ports:</text>
    <text x="20" y="187" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">      - <tspan fill="#28c840">"1688:1688"</tspan></text>
    <text x="20" y="210" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">    restart: <tspan fill="#ffb900">always</tspan></text>
    <text x="20" y="233" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">    environment:</text>
    <text x="20" y="256" font-family="'Consolas', monospace" font-size="13" fill="#8ab4d4">      - <tspan fill="#28c840">KMS_LOGLEVEL=INFO</tspan></text>

    <!-- Running indicator -->
    <circle cx="30" cy="306" r="8" fill="#28c840" opacity="0.9"/>
    <text x="48" y="312" font-family="'Consolas', monospace" font-size="13" fill="#28c840">Running on port 1688</text>
  </g>

  <!-- Docker logo watermark -->
  <g transform="translate(840, 120)" opacity="0.9">
    <!-- Docker whale simplified -->
    <rect x="0" y="60" width="260" height="140" rx="14" fill="#2496ed" opacity="0.2"/>
    <rect x="0" y="60" width="260" height="140" rx="14" fill="none" stroke="#2496ed" stroke-width="2"/>
    <!-- Container stacks on whale -->
    <rect x="30" y="20" width="42" height="32" rx="4" fill="#2496ed" opacity="0.85"/>
    <rect x="80" y="20" width="42" height="32" rx="4" fill="#2496ed" opacity="0.85"/>
    <rect x="130" y="20" width="42" height="32" rx="4" fill="#2496ed" opacity="0.85"/>
    <rect x="30" y="60" width="42" height="32" rx="4" fill="#2496ed" opacity="0.9"/>
    <rect x="80" y="60" width="42" height="32" rx="4" fill="#2496ed" opacity="0.9"/>
    <rect x="130" y="60" width="42" height="32" rx="4" fill="#2496ed" opacity="0.9"/>
    <rect x="180" y="60" width="42" height="32" rx="4" fill="#2496ed" opacity="0.9"/>
    <text x="130" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#2496ed" text-anchor="middle">Docker</text>
    <text x="130" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#8ab4d4" text-anchor="middle">Container</text>
  </g>

  <!-- KMS label badge -->
  <g transform="translate(840, 310)">
    <rect x="0" y="0" width="260" height="70" rx="10" fill="#1e2840" stroke="#0078d4" stroke-width="2" opacity="0.9"/>
    <text x="130" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8ab4d4" text-anchor="middle">KEY MANAGEMENT SERVICE</text>
    <text x="130" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="700">py-kms</text>
  </g>

  <!-- Main text -->
  <text x="660" y="455" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="700"
        fill="white" text-anchor="middle" filter="url(#softGlow)">KMS Server</text>
  <text x="660" y="503" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="400"
        fill="#8ab4d4" text-anchor="middle">Local Setup with Docker Compose</text>

  <rect x="380" y="520" width="560" height="2" rx="1" fill="#0078d4" opacity="0.6"/>

  <!-- Tag pills -->
  <g transform="translate(385, 546)">
    <rect x="0" y="0" width="100" height="38" rx="19" fill="#0078d4" opacity="0.25"/>
    <rect x="0" y="0" width="100" height="38" rx="19" fill="none" stroke="#0078d4" stroke-width="1.5" opacity="0.6"/>
    <text x="50" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#8ab4d4" text-anchor="middle">KMS</text>
    <rect x="115" y="0" width="110" height="38" rx="19" fill="#2496ed" opacity="0.18"/>
    <rect x="115" y="0" width="110" height="38" rx="19" fill="none" stroke="#2496ed" stroke-width="1.5" opacity="0.5"/>
    <text x="170" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#2496ed" text-anchor="middle">Docker</text>
    <rect x="240" y="0" width="110" height="38" rx="19" fill="#0078d4" opacity="0.25"/>
    <rect x="240" y="0" width="110" height="38" rx="19" fill="none" stroke="#0078d4" stroke-width="1.5" opacity="0.6"/>
    <text x="295" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#8ab4d4" text-anchor="middle">py-kms</text>
  </g>

  <text x="1160" y="600" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600"
        fill="#0078d4" text-anchor="end" opacity="0.8">BankaiTech Docs</text>
</svg>
