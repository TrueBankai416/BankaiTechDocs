<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hexStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  style="stop-color:#cc1a00"/>
      <stop offset="100%" style="stop-color:#d4a017"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  style="stop-color:#060606"/>
      <stop offset="100%" style="stop-color:#120202"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="redGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#cc1a00" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" fill="url(#bgGrad)" rx="8"/>

  <!-- Outer halo ring -->
  <polygon points="32,4 55,17 55,47 32,60 9,47 9,17"
           fill="none" stroke="#cc1a00" stroke-width="0.8" opacity="0.25"/>

  <!-- Hexagon body -->
  <polygon points="32,8 52,19.5 52,42.5 32,54 12,42.5 12,19.5"
           fill="#0a0101" stroke="url(#hexStroke)" stroke-width="2.5"
           filter="url(#glow)"/>

  <!-- Inner hex ring -->
  <polygon points="32,13 47,21.5 47,38.5 32,47 17,38.5 17,21.5"
           fill="none" stroke="#cc1a00" stroke-width="0.7" opacity="0.2"/>

  <!-- "B" letter — white, high contrast at small sizes -->
  <text x="32" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="900"
        fill="white" text-anchor="middle" filter="url(#redGlow)">B</text>

  <!-- Corner node dots -->
  <circle cx="32" cy="8"  r="1.5" fill="#cc1a00" opacity="0.9"/>
  <circle cx="52" cy="19.5" r="1.2" fill="#cc1a00" opacity="0.6"/>
  <circle cx="52" cy="42.5" r="1.2" fill="#d4a017" opacity="0.6"/>
  <circle cx="32" cy="54" r="1.5" fill="#d4a017" opacity="0.9"/>
  <circle cx="12" cy="42.5" r="1.2" fill="#d4a017" opacity="0.6"/>
  <circle cx="12" cy="19.5" r="1.2" fill="#cc1a00" opacity="0.6"/>
</svg>
